<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2440" viewBox="0 0 1800 2440"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#263747"><text x="50" y="48.76" text-anchor="start" font-size="14" font-weight="600" fill="#5E6C78">NATS  /  SIMULATOR DESIGN  /  03</text><text x="50" y="99.88" text-anchor="start" font-size="32" font-weight="600" fill="#263747">One journey: planning, flight and turnaround</text><text x="50" y="140.12" text-anchor="start" font-size="18" font-weight="400" fill="#5E6C78">Read from top to bottom. Origin and destination can be any connected pair of vertiports.</text><rect x="30" y="184" width="270" height="52" rx="0" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="165.0" y="216.12" text-anchor="middle" font-size="18" font-weight="600">aircraft : Aircraft</text><path d="M 165,236 L 165,2260" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="400" y="184" width="270" height="52" rx="0" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="535.0" y="216.12" text-anchor="middle" font-size="18" font-weight="600">scheduler : Scheduler</text><path d="M 535,236 L 535,2260" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="785" y="184" width="270" height="52" rx="0" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="920.0" y="216.12" text-anchor="middle" font-size="18" font-weight="600">origin : Vertiport</text><path d="M 920,236 L 920,2260" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1155" y="184" width="270" height="52" rx="0" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="1290.0" y="216.12" text-anchor="middle" font-size="18" font-weight="600">destination : Vertiport</text><path d="M 1290,236 L 1290,2260" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1500" y="184" width="270" height="52" rx="0" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="1635.0" y="216.12" text-anchor="middle" font-size="18" font-weight="600">recorder : Recorder</text><path d="M 1635,236 L 1635,2260" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="50" y="261" width="1700" height="40" rx="0" fill="#F3F6F9" stroke="#D7E0E7" stroke-width="1.5"/><text x="67" y="287.12" text-anchor="start" font-size="18" font-weight="600" fill="#263747">A  /  Plan the journey — aircraft waits at its origin stand</text><path d="M 165,346 L 1635,346" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1625.0,341.0 1635,346 1625.0,351.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="314" width="1446" height="29" fill="#FFFFFF"/><text x="900.0" y="334.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">1. record_state(Waiting for dispatch)</text><path d="M 165,394 L 535,394" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="525.0,389.0 535,394 525.0,399.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="362" width="346" height="29" fill="#FFFFFF"/><text x="350.0" y="382.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">2. request_plan(aircraft)</text><path d="M 535,446 L 625,446 L 625,470 L 535,470" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="545.0,475.0 535,470 545.0,465.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="550" y="417" width="315" height="26" fill="#FFFFFF"/><text x="707.5" y="435.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">3. select_route(aircraft)</text><rect x="480" y="491" width="880" height="370" rx="0" fill="none" stroke="#536879" stroke-width="1.5"/><rect x="494" y="501" width="845" height="30" fill="#FFFFFF"/><text x="494" y="521.78" text-anchor="start" font-size="17" font-weight="600" fill="#263747">loop  [planning events, until a complete plan is feasible]</text><path d="M 535,579 L 920,579" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="910.0,574.0 920,579 910.0,584.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="547" y="547" width="361" height="29" fill="#FFFFFF"/><text x="727.5" y="567.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">4. availability(departure window)</text><path d="M 920,628 L 535,628" fill="none" stroke="#536879" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="545.0,633.0 535,628 545.0,623.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="547" y="596" width="361" height="29" fill="#FFFFFF"/><text x="727.5" y="616.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">5. pad calendar; stand-release constraints</text><path d="M 535,681 L 1290,681" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,676.0 1290,681 1280.0,686.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="547" y="649" width="731" height="29" fill="#FFFFFF"/><text x="912.5" y="669.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">6. availability(arrival and stand windows)</text><path d="M 1290,732 L 535,732" fill="none" stroke="#536879" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="545.0,737.0 535,732 545.0,727.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="547" y="700" width="731" height="29" fill="#FFFFFF"/><text x="912.5" y="720.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">7. pad calendar; future stand availability</text><path d="M 535,784 L 625,784 L 625,808 L 535,808" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="545.0,813.0 535,808 545.0,803.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="550" y="755" width="315" height="26" fill="#FFFFFF"/><text x="707.5" y="773.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">8. check headway and operation order</text><rect x="552" y="826" width="779" height="26" fill="#FFFFFF"/><text x="552" y="844.44" text-anchor="start" font-size="16" font-weight="400" fill="#5E6C78">[no plan] Remain at origin; retry on the next relevant event.</text><rect x="480" y="895" width="880" height="202" rx="0" fill="none" stroke="#536879" stroke-width="1.5"/><rect x="494" y="901" width="845" height="32" fill="#FFFFFF"/><text x="494" y="922.78" text-anchor="start" font-size="17" font-weight="600" fill="#263747">critical  [commit the complete plan or coordinated batch]</text><path d="M 535,972 L 920,972" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="910.0,967.0 920,972 910.0,977.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="547" y="940" width="361" height="29" fill="#FFFFFF"/><text x="727.5" y="960.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">9. reserve(plan)</text><path d="M 535,1020 L 1290,1020" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,1015.0 1290,1020 1280.0,1025.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="547" y="988" width="731" height="29" fill="#FFFFFF"/><text x="912.5" y="1008.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">10. reserve(plan)</text><path d="M 535,1066 L 625,1066 L 625,1090 L 535,1090" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="545.0,1095.0 535,1090 545.0,1085.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="550" y="1037" width="315" height="26" fill="#FFFFFF"/><text x="707.5" y="1055.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">11. commit route slot and stand allocations</text><path d="M 535,1145 L 165,1145" fill="none" stroke="#536879" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="175.0,1150.0 165,1145 175.0,1140.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1113" width="346" height="29" fill="#FFFFFF"/><text x="350.0" y="1133.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">12. committed FlightPlan</text><text x="1735" y="1139.04" text-anchor="end" font-size="16" font-weight="400" fill="#5E6C78">A coordinated batch can free stands at full ports.</text><text x="1735" y="1159.84" text-anchor="end" font-size="16" font-weight="400" fill="#5E6C78">Destination capacity must be available at arrival, not necessarily now.</text><rect x="50" y="1183" width="1700" height="40" rx="0" fill="#F3F6F9" stroke="#D7E0E7" stroke-width="1.5"/><text x="67" y="1209.12" text-anchor="start" font-size="18" font-weight="600" fill="#263747">B  /  Execute the reserved journey — wait at the origin until the planned transfer time</text><path d="M 165,1265 L 920,1265" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="910.0,1260.0 920,1265 910.0,1270.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1233" width="731" height="29" fill="#FFFFFF"/><text x="542.5" y="1253.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">13. begin transfer out; release origin stand</text><path d="M 165,1314 L 255,1314 L 255,1338 L 165,1338" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,1343.0 165,1338 175.0,1333.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="1285" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="1303.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">14. transfer to pad</text><path d="M 165,1375 L 920,1375" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="910.0,1370.0 920,1375 910.0,1380.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1343" width="731" height="29" fill="#FFFFFF"/><text x="542.5" y="1363.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">15. begin take-off; occupy reserved pad</text><path d="M 165,1424 L 255,1424 L 255,1448 L 165,1448" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,1453.0 165,1448 175.0,1443.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="1395" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="1413.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">16. perform take-off</text><path d="M 165,1485 L 920,1485" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="910.0,1480.0 920,1485 910.0,1490.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1453" width="731" height="29" fill="#FFFFFF"/><text x="542.5" y="1473.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">17. end take-off; release pad</text><path d="M 165,1534 L 1635,1534" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1625.0,1529.0 1635,1534 1625.0,1539.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1502" width="1446" height="29" fill="#FFFFFF"/><text x="900.0" y="1522.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">18. record_state(Cruise)</text><path d="M 165,1583 L 255,1583 L 255,1607 L 165,1607" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,1612.0 165,1607 175.0,1602.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="1554" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="1572.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">19. cruise for route.cruise_time()</text><path d="M 165,1644 L 1290,1644" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,1639.0 1290,1644 1280.0,1649.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1612" width="1101" height="29" fill="#FFFFFF"/><text x="727.5" y="1632.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">20. begin landing; occupy reserved pad</text><path d="M 165,1693 L 255,1693 L 255,1717 L 165,1717" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,1722.0 165,1717 175.0,1712.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="1664" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="1682.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">21. perform landing</text><path d="M 165,1754 L 1290,1754" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,1749.0 1290,1754 1280.0,1759.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1722" width="1101" height="29" fill="#FFFFFF"/><text x="727.5" y="1742.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">22. end landing; release pad once clear</text><path d="M 165,1803 L 255,1803 L 255,1827 L 165,1827" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,1832.0 165,1827 175.0,1822.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="1774" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="1792.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">23. transfer to reserved stand</text><path d="M 165,1864 L 1290,1864" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,1859.0 1290,1864 1280.0,1869.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1832" width="1101" height="29" fill="#FFFFFF"/><text x="727.5" y="1852.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">24. occupy destination stand</text><rect x="50" y="1890" width="1700" height="40" rx="0" fill="#F3F6F9" stroke="#D7E0E7" stroke-width="1.5"/><text x="67" y="1916.12" text-anchor="start" font-size="18" font-weight="600" fill="#263747">C  /  Turn around at the destination — keep the stand until the next departure</text><path d="M 165,1963 L 255,1963 L 255,1987 L 165,1987" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,1992.0 165,1987 175.0,1982.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="1934" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="1952.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">25. unload passengers</text><path d="M 165,2024 L 1290,2024" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,2019.0 1290,2024 1280.0,2029.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="1992" width="1101" height="29" fill="#FFFFFF"/><text x="727.5" y="2012.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">26. request a charger</text><path d="M 1290,2068 L 165,2068" fill="none" stroke="#536879" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="175.0,2073.0 165,2068 175.0,2063.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="177" y="2036" width="1101" height="29" fill="#FFFFFF"/><text x="727.5" y="2056.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">27. charger acquired (may wait)</text><path d="M 165,2112 L 1635,2112" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1625.0,2107.0 1635,2112 1625.0,2117.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="2080" width="1446" height="29" fill="#FFFFFF"/><text x="900.0" y="2100.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">28. record_state(Charging)</text><path d="M 165,2156 L 255,2156 L 255,2180 L 165,2180" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,2185.0 165,2180 175.0,2175.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="2127" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="2145.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">29. charge for configured duration</text><path d="M 165,2216 L 1290,2216" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1280.0,2211.0 1290,2216 1280.0,2221.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="2184" width="1101" height="29" fill="#FFFFFF"/><text x="727.5" y="2204.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">30. release charger</text><path d="M 165,2265 L 255,2265 L 255,2289 L 165,2289" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="175.0,2294.0 165,2289 175.0,2284.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="180" y="2236" width="315" height="26" fill="#FFFFFF"/><text x="337.5" y="2254.44" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">31. board passengers</text><path d="M 165,2324 L 1635,2324" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1625.0,2319.0 1635,2324 1625.0,2329.0" fill="#536879" stroke="#536879" stroke-width="1.6"/><rect x="177" y="2292" width="1446" height="29" fill="#FFFFFF"/><text x="900.0" y="2312.28" text-anchor="middle" font-size="17" font-weight="400" fill="#263747">32. record_state(Ready) — repeat from this port</text><path d="M 165,2260 L 165,2340" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 535,2260 L 535,2340" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 920,2260 L 920,2340" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 1290,2260 L 1290,2340" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 1635,2260 L 1635,2340" fill="none" stroke="#ACBAC6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 50,2374 L 1750,2374" fill="none" stroke="#CFD7DF" stroke-width="1.6" /><text x="50" y="2409.1" text-anchor="start" font-size="15" font-weight="400" fill="#5E6C78">Deterministic baseline. Record every activity and resource change; only selected Recorder messages are drawn. Reservations require implementation and testing.</text></g></svg>