<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="990" viewBox="0 0 1740 990"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#263747"><text x="50" y="48.76" text-anchor="start" font-size="14" font-weight="600" fill="#5E6C78">NATS  /  SIMULATOR DESIGN  /  02</text><text x="50" y="99.88" text-anchor="start" font-size="32" font-weight="600" fill="#263747">Aircraft lifecycle</text><text x="50" y="140.12" text-anchor="start" font-size="18" font-weight="400" fill="#5E6C78">One complete cycle. Each activity is timed separately for flying, charging and waiting analysis.</text><rect x="50" y="190" width="1640" height="245" rx="12" fill="#FFFFFF" stroke="#B9C8D4" stroke-width="1.5"/><text x="73" y="225.8" text-anchor="start" font-size="20" font-weight="600" fill="#263747">At a stand</text><rect x="80" y="300" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="170.0" y="339.46" text-anchor="middle" font-size="19" font-weight="400">Unloading</text><rect x="350" y="300" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="440.0" y="327.10999999999996" text-anchor="middle" font-size="19" font-weight="400">Waiting for</text><text x="440.0" y="351.80999999999995" text-anchor="middle" font-size="19" font-weight="400">charger</text><rect x="620" y="300" width="180" height="66" rx="13" fill="#E8F3EF" stroke="#536879" stroke-width="1.5"/><text x="710.0" y="339.46" text-anchor="middle" font-size="19" font-weight="400">Charging</text><rect x="890" y="300" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="980.0" y="339.46" text-anchor="middle" font-size="19" font-weight="400">Boarding</text><rect x="1160" y="300" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="1250.0" y="339.46" text-anchor="middle" font-size="19" font-weight="400">Ready</text><rect x="1430" y="300" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="1520.0" y="327.10999999999996" text-anchor="middle" font-size="19" font-weight="400">Waiting for</text><text x="1520.0" y="351.80999999999995" text-anchor="middle" font-size="19" font-weight="400">dispatch</text><path d="M 260,333 L 350,333" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="340.0,328.0 350,333 340.0,338.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="250" y="253" width="110" height="46" fill="#FFFFFF"/><text x="305.0" y="271.65999999999997" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">unloading</text><text x="305.0" y="289.85999999999996" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">complete</text><path d="M 530,333 L 620,333" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="610.0,328.0 620,333 610.0,338.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="520" y="253" width="110" height="46" fill="#FFFFFF"/><text x="575.0" y="271.65999999999997" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">charger</text><text x="575.0" y="289.85999999999996" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">acquired</text><path d="M 800,333 L 890,333" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="880.0,328.0 890,333 880.0,338.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="790" y="253" width="110" height="46" fill="#FFFFFF"/><text x="845.0" y="271.65999999999997" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">charge complete</text><text x="845.0" y="289.85999999999996" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">/ release charger</text><path d="M 1070,333 L 1160,333" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1150.0,328.0 1160,333 1150.0,338.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="1060" y="253" width="110" height="46" fill="#FFFFFF"/><text x="1115.0" y="271.65999999999997" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">boarding</text><text x="1115.0" y="289.85999999999996" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">complete</text><path d="M 1340,333 L 1430,333" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1420.0,328.0 1430,333 1420.0,338.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="1330" y="253" width="110" height="46" fill="#FFFFFF"/><text x="1385.0" y="271.65999999999997" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">request</text><text x="1385.0" y="289.85999999999996" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">flight plan</text><text x="310" y="404.78" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">Stand occupied throughout this group. Only Charging occupies a charger. Waiting may have zero duration.</text><circle cx="1248" cy="258" r="10" fill="#263747"/><path d="M 1248,268 L 1248,300" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1253.0,290.0 1248,300 1243.0,290.0" fill="none" stroke="#536879" stroke-width="1.6"/><text x="1264" y="263.26" text-anchor="start" font-size="14" font-weight="400" fill="#5E6C78">initially ready</text><rect x="320" y="555" width="1370" height="250" rx="12" fill="#FFFFFF" stroke="#B9C8D4" stroke-width="1.5"/><text x="343" y="590.8" text-anchor="start" font-size="20" font-weight="600" fill="#263747">Journey</text><rect x="350" y="662" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="440.0" y="701.46" text-anchor="middle" font-size="19" font-weight="400">Transfer to stand</text><rect x="620" y="662" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="710.0" y="701.46" text-anchor="middle" font-size="19" font-weight="400">Landing</text><rect x="890" y="662" width="180" height="66" rx="13" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="980.0" y="701.46" text-anchor="middle" font-size="19" font-weight="400">Cruise</text><rect x="1160" y="662" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="1250.0" y="701.46" text-anchor="middle" font-size="19" font-weight="400">Take-off</text><rect x="1430" y="662" width="180" height="66" rx="13" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="1520.0" y="701.46" text-anchor="middle" font-size="19" font-weight="400">Transfer to pad</text><path d="M 1430,695 L 1340,695" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1350.0,700.0 1340,695 1350.0,690.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="1330" y="612" width="110" height="46" fill="#FFFFFF"/><text x="1385.0" y="630.66" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">departure slot</text><text x="1385.0" y="648.86" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">/ occupy pad</text><path d="M 1160,695 L 1070,695" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1080.0,700.0 1070,695 1080.0,690.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="1060" y="612" width="110" height="46" fill="#FFFFFF"/><text x="1115.0" y="630.66" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">departure complete</text><text x="1115.0" y="648.86" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">/ release pad</text><path d="M 890,695 L 800,695" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="810.0,700.0 800,695 810.0,690.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="790" y="612" width="110" height="46" fill="#FFFFFF"/><text x="845.0" y="630.66" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">arrival slot</text><text x="845.0" y="648.86" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">/ occupy pad</text><path d="M 620,695 L 530,695" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="540.0,700.0 530,695 540.0,690.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="520" y="612" width="110" height="46" fill="#FFFFFF"/><text x="575.0" y="630.66" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">pad clear</text><text x="575.0" y="648.86" text-anchor="middle" font-size="14" font-weight="400" fill="#263747">/ release pad</text><path d="M 1520,366 L 1520,662" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1525.0,652.0 1520,662 1515.0,652.0" fill="none" stroke="#536879" stroke-width="1.6"/><text x="1480" y="485.72999999999996" text-anchor="end" font-size="17" font-weight="400" fill="#263747">plan committed and transfer due</text><text x="1480" y="507.83" text-anchor="end" font-size="17" font-weight="400" fill="#263747">/ release origin stand</text><path d="M 350,695 L 170,695 L 170,366" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="165.0,376.0 170,366 175.0,376.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="52" y="487" width="230" height="62" fill="#FFFFFF"/><text x="167.0" y="513.0400000000001" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">destination stand reached</text><text x="167.0" y="533.84" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">/ occupy stand; update port</text><text x="345" y="774.28" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">Departure and arrival resources are reserved before leaving the origin stand; destination capacity is checked for arrival time.</text><text x="50" y="871.42" text-anchor="start" font-size="18" font-weight="400" fill="#5E6C78">Turnaround is sequential: unload → charge → board. Cruise is measured separately from take-off, landing and transfers.</text><text x="50" y="894.8199999999999" text-anchor="start" font-size="18" font-weight="400" fill="#5E6C78">At the run horizon, include elapsed time in the current activity; aircraft are not forced to complete the cycle.</text><path d="M 50,924 L 1690,924" fill="none" stroke="#CFD7DF" stroke-width="1.6" /><text x="50" y="959.1" text-anchor="start" font-size="15" font-weight="400" fill="#5E6C78">Operational UML state diagram. These activity labels do not, by themselves, define a continuous-time Markov chain.</text></g></svg>