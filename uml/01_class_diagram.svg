8" text-anchor="start" font-size="17" font-weight="400" fill="#263747">departure_time, arrival_time : float</text><text x="66" y="1084.83" text-anchor="start" font-size="17" font-weight="400" fill="#263747">resource_windows : reservations</text><text x="66" y="1106.9299999999998" text-anchor="start" font-size="17" font-weight="400" fill="#263747">status : pending | committed</text><rect x="50" y="1124" width="440" height="16" rx="0" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="66" y="1137.78" text-anchor="start" font-size="17" font-weight="400" fill="#263747"></text><rect x="670" y="970" width="440" height="170" rx="0" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><rect x="670" y="970" width="440" height="42" rx="0" fill="#EAF1F8" stroke="#536879" stroke-width="1.5"/><text x="890.0" y="997.8" text-anchor="middle" font-size="20" font-weight="600">Route</text><text x="686" y="1039.68" text-anchor="start" font-size="17" font-weight="400" fill="#263747">id : str</text><text x="686" y="1061.78" text-anchor="start" font-size="17" font-weight="400" fill="#263747">distance_hat, speed_hat : float</text><text x="686" y="1083.88" text-anchor="start" font-size="17" font-weight="400" fill="#263747">headway_hat : float</text><rect x="670" y="1100" width="440" height="40" rx="0" fill="#FFFFFF" stroke="#536879" stroke-width="1.5"/><text x="686" y="1125.78" text-anchor="start" font-size="17" font-weight="400" fill="#263747">+ cruise_time() : float</text><path d="M 670,290 L 490,290" fill="none" stroke="#536879" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="500.0,295.0 490,290 500.0,285.0" fill="none" stroke="#536879" stroke-width="1.6"/><rect x="510" y="252" width="140" height="27" fill="#FFFFFF"/><text x="580.0" y="270.94" text-anchor="middle" font-size="16" font-weight="400" fill="#263747">reads</text><path d="M 1110,270 L 1310,270" fill="none" stroke="#536879" stroke-width="1.6" /><polygon points="1110,270 1118.0,275.0 1126.0,270.0 1118.0,265.