oints="1445.0,841.0 1450,831 1455.0,841.0" fill="none" stroke="#536879" stroke-width="1.6"/><text x="798" y="954.44" text-anchor="start" font-size="16" font-weight="400" fill="#263747">0..*</text><rect x="1360" y="867" width="80" height="24" fill="#FFFFFF"/><text x="1360" y="884.44" text-anchor="start" font-size="16" font-weight="400" fill="#263747">origin 1</text><path d="M 1020,970 L 1020,935 L 1630,935 L 1630,831" fill="none" stroke="#536879" stroke-width="1.6" /><polyline points="1625.0,841.0 1630,831 1635.0,841.0" fill="none" stroke="#536879" stroke-width="1.6"/><text x="1032" y="959.44" text-anchor="start" font-size="16" font-weight="400" fill="#263747">0..*</text><text x="1640" y="883.44" text-anchor="start" font-size="16" font-weight="400" fill="#263747">destination 1</text><text x="1310" y="1019.8" text-anchor="start" font-size="20" font-weight="600" fill="#263747">Notation and assumptions</text><text x="1310" y="1067.58" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">Filled diamond: composition (owns parts).</text><text x="1310" y="1089.6799999999998" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">Dashed arrow: dependency. 0..*: any number.</text><text x="1310" y="1111.78" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">Runtime times, distances and speeds are</text><text x="1310" y="1133.8799999999999" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">dimensionless. Reverse travel uses a new route.</text><text x="1310" y="1155.98" text-anchor="start" font-size="17" font-weight="400" fill="#5E6C78">Cruise duration = distance_hat / speed_hat.</text><path d="M 50,1224 L 1750,1224" fill="none" stroke="#CFD7DF" stroke-width="1.6" /><text x="50" y="1259.1" text-anchor="start" font-size="15" font-weight="400" fill="#5E6C78">Proposed design. All state and resource changes are recorded; the original starter code has not yet been refactored to this design.</text></g></svg>